[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cop_ard_core"
authors = [{ name = "B-Open" }]
dynamic = ["version", "description"]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
requires-python = ">=3.11"

# By default, the project template does not rely on any specific
# version of the EOPF CPM. The source code examples are validated
# against the latest release.
# Users are encouraged to fix the EOPF CPM version to make sure to
# have a stable build environment.
dependencies = [
    "s1-ard-core==1.0.0",
]
license = { file = "LICENSE" }

[project.optional-dependencies]
cluster-plugin = ["eopf[cluster-plugin] >= 2.5.8"]
tests = ["eopf[tests] >= 2.5.8"]
linter = ["eopf[linter] >= 2.5.8"]
typing = ["eopf[typing] >= 2.5.8"]
formatter = ["eopf[formatter] >= 2.5.8"]
security = ["eopf[security] >= 2.5.8"]
notebook = ["eopf[notebook] >= 2.5.8"]
doc = [
    "eopf[doc]",
    # Align the versions with the ones from the 'python-build-environment' project.
    # "sphinxcontrib-mermaid",
    # Dependency required to be present for sphinx-test-reports to work,
    # even though never used. The extension will actually not work as it
    # requires PlantUML to be installed, which is a Java library.
    "sphinxcontrib-plantuml",
    "sphinxcontrib-spelling",
    "sphinx-test-reports",
    "docxbuilder",
]
complexity = ["eopf[complexity] >= 2.5.8"]
doc-cov = ["eopf[doc-cov] >= 2.5.8"]
dev = ["eopf[dev] >= 2.5.8"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
markers = [
    "integration",
    "unit",
    "need_files",
    "l1",
    "l2",
    "sm",
    "ew",
    "iw",
    "osw",
    "owi",
    "ard",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

# s1-ard-core
[[tool.uv.index]]
url = "https://gitlab.eopf.copernicus.eu/api/v4/projects/114/packages/pypi/simple"

