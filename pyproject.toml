[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cop_ard_core"
authors = [{ name = "B-Open" }]
dynamic = ["version", "description"]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
requires-python = ">=3.13, <3.14"

# By default, the project template does not rely on any specific
# version of the EOPF CPM. The source code examples are validated
# against the latest release.
# Users are encouraged to fix the EOPF CPM version to make sure to
# have a stable build environment.
dependencies = [
    "astropy>=7.2.0",
    "dask>=2026.3.0",
    "defusedxml>=0.7.1",
    "h5netcdf>=1.8.1",
    "mgrs>=1.5.4",
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "ortools>=9.15.6755",
    "psutil>=7.2.2",
    "pyiri>=0.1.7",
    "pyproj>=3.7.2",
    "rasterio>=1.5.0",
    "retry>=0.9.2",
    "rioxarray>=0.22.0",
    "s3fs>=2026.4.0",
    "sarpy>=2.0.1",
    "scipy>=1.17.1",
    "shapely",
    "structlog>=26.1.0",
    "xarray",
    "xarray-spatial",
    "xrft>=1.0.1",
    "zarr>=3.2.1",
]
license = { file = "LICENSE" }

[project.optional-dependencies]
cluster-plugin = ["eopf[cluster-plugin] >= 3.0.0rc2"]
tests = ["eopf[tests] >= 3.0.0rc2"]
linter = ["eopf[linter] >= 3.0.0rc2"]
typing = ["eopf[typing] >= 3.0.0rc2", "ty"]
formatter = ["eopf[formatter] >= 3.0.0rc2"]
security = ["eopf[security] >= 3.0.0rc2"]
notebook = ["eopf[notebook] >= 3.0.0rc2"]
doc = [
    "eopf[doc]",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-plantuml",
    "sphinxcontrib-spelling",
    "sphinx-test-reports",
]
complexity = ["eopf[complexity] >= 3.0.0rc2"]
doc-cov = ["eopf[doc-cov] >= 3.0.0rc2"]
dev = ["ipykernel","matplotlib","pytest-env"]

[tool.ruff]
line-length = 120
target-version = "py313"


[tool.pytest.ini_options]
markers = ["integration", "unit", "need_files"]
[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.pytest_env]
NUMBA_DISABLE_JIT=1

# Add the gitlab token in your `.netrc` file to allow `uv lock`
# s1-ard-core
[[tool.uv.index]]
url = "https://gitlab.eopf.copernicus.eu/api/v4/projects/114/packages/pypi/simple"
