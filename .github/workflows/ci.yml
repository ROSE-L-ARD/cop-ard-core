name: Python Quality Checks

# This tells GitHub to run the workflow on pushes to main,
# and whenever a Pull Request is opened against main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

  env:
        SOURCES: "cop_ard_core"

      steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run --extra linter --frozen ruff check $SOURCES

      - name: Type check with Mypy
        run: uv run --extra typing --frozen mypy $SOURCES
