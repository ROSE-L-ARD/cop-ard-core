[mypy-mgrs.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-ortools.*]
ignore_missing_imports = True

[mypy-PyIRI.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-sarpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
